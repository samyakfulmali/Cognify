<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="cogGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="cogGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="cogGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Shield -->
  <rect width="64" height="64" rx="16" fill="url(#tileGrad)" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1.5"/>
  
  <!-- Inner Neural Graph Grid -->
  <line x1="16" y1="34" x2="33" y2="33" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-dasharray="2 2"/>
  <line x1="33" y1="33" x2="47" y2="20" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-dasharray="2 2"/>
  <line x1="33" y1="33" x2="47" y2="44" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-dasharray="2 2"/>
  <line x1="28" y1="16" x2="33" y2="33" stroke="rgba(255,255,255,0.2)" stroke-width="1.2"/>
  <line x1="29" y1="50" x2="33" y2="33" stroke="rgba(255,255,255,0.2)" stroke-width="1.2"/>
  
  <!-- Main Glowing 'C' Knowledge Arc -->
  <path d="M47 20C42 14.5 35 13 28 15C19 17.5 14 25.5 14 34C14 43 19.5 50.5 29 51C36 51.5 43 48.5 47 44" 
        stroke="url(#cogGrad1)" stroke-width="4.5" stroke-linecap="round" fill="none" filter="url(#cogGlow)"/>
  
  <!-- Inner Dynamic Cognitive Loop -->
  <path d="M26 24C32 21 39 25 41 31C42.5 36.5 39 41.5 33 42.5" 
        stroke="url(#cogGrad2)" stroke-width="2.8" stroke-linecap="round" fill="none"/>
  
  <!-- Network Nodes with White Core Accents -->
  <circle cx="47" cy="20" r="4.2" fill="#6366F1" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="28" cy="15" r="3.5" fill="#8B5CF6" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="14" cy="34" r="4.8" fill="#06B6D4" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="29" cy="51" r="3.6" fill="#10B981" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="47" cy="44" r="4.2" fill="#38BDF8" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="33" cy="33" r="3.2" fill="#F43F5E" stroke="#FFFFFF" stroke-width="1.5"/>
</svg>
